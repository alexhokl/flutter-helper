# Analyzes and tests the package with the same Flutter image the apps build
# with, so a release tag cannot break an app's CI build.
logsBucket: gs://craffy-build-logs
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s

substitutions:
  _FLUTTER_IMAGE: asia-east1-docker.pkg.dev/craffy/private/flutter:3.47.7

steps:
  - name: "${_FLUTTER_IMAGE}"
    id: Flutter pub get
    entrypoint: flutter
    args: ["pub", "get"]

  - name: "${_FLUTTER_IMAGE}"
    id: Flutter analyze
    waitFor: [Flutter pub get]
    entrypoint: flutter
    args: ["analyze", "--no-pub"]

  - name: "${_FLUTTER_IMAGE}"
    id: Flutter test
    waitFor: [Flutter pub get]
    entrypoint: flutter
    args: ["test", "--no-pub"]
