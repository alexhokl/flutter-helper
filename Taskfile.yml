version: "3"

tasks:
  test:
    desc: Test
    cmd: flutter test

  coverage:
    desc: Test with coverage
    cmd: flutter test --coverage

  lint:
    desc: Lint
    cmds:
      - flutter analyze
      - dart fix --dry-run

  lint-fix:
    desc: Lint fix
    cmd: dart fix --apply

  format:
    desc: Format
    cmd: dart format lib test

  tag:
    desc: Create a git tag (vX.Y.Z) for the version in pubspec.yaml
    silent: true
    cmds:
      - |
        VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
        grep -q "^## $VERSION" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $VERSION"; exit 1; }
        git tag "v$VERSION"
        echo "Created tag v$VERSION"
